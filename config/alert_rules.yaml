alerts:
  - name: High request latency
    severity: critical
    condition: 'p95(response_sent.latency_ms) > 3000'
    duration: 10m
    type: symptom-based
    channel: '#llmops-alerts'
    owner: llm-platform
    runbook: docs/alerts.md#high-request-latency
  - name: Elevated request error rate
    severity: critical
    condition: 'count(request_failed) / count(request_received) * 100 > 2'
    duration: 5m
    type: symptom-based
    channel: '#llmops-alerts'
    owner: api-oncall
    runbook: docs/alerts.md#elevated-request-error-rate
  - name: Quality degradation
    severity: warning
    condition: 'avg(response_sent.quality_score) < 0.75'
    duration: 15m
    type: symptom-based
    channel: '#llmops-alerts'
    owner: ai-quality
    runbook: docs/alerts.md#quality-degradation
